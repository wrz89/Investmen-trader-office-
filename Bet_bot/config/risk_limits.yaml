# ─────────────────────────────────────────────────────────────
#  LIMITI DEL RISK MANAGER (Bruno) — veto assoluto
#  File sigillato all'avvio: se cambia a bot acceso, nessuna nuova puntata.
#  Tarati per un bankroll di partenza di 30 €.
# ─────────────────────────────────────────────────────────────

# ── Trade su exchange (back→lay con stop) ─────────────────────
max_risk_per_trade_pct: 0.015  # perdita massima allo stop (con scivolamento) ≤ 1,5% del bankroll (0,45 € su 30 €)
max_trade_stake_pct: 0.25      # puntata del trade ≤ 25% del bankroll (il denaro resta bloccato finché si chiude)
max_open_trade_stake_pct: 0.15 # "salto di prezzo": la somma delle puntate dei trade aperti ≤ 15% del bankroll
max_open_trades_small: 1       # sotto small_bankroll: un solo trade aperto alla volta, alla puntata minima

# ── Puntate secche (si perde tutta la puntata) ────────────────
sizing: kelly            # kelly | flat
kelly_fraction: 0.25     # 1/4 di Kelly calcolato sulla quota netta di commissione
max_stake_pct: 0.10      # tetto per puntata secca: con 2 € minimi le puntate secche restano possibili fino a 20 € di bankroll
                         # (una alla volta sotto i 25 €, vedi max_open_risk_pct)
# Con bankroll piccolo 1/4 di Kelly è quasi sempre sotto i 2 € minimi di betfair.it: la puntata minima
# passa solo se resta ≤ metà del Kelly pieno, cioè solo quando il vantaggio stimato è netto.
min_stake_max_kelly_share: 0.5
flat_stake_pct: 0.01

# ── Reinvestimento ────────────────────────────────────────────
reinvest_fraction: 1.0          # 1,0 = compounding pieno sui profitti
floor_pct_of_initial: 0.90      # sotto il 90% del capitale la base è il bankroll stesso

# ── Esposizione ───────────────────────────────────────────────
max_open_risk_pct: 0.08         # somma delle perdite massime delle posizioni aperte ≤ 8% del bankroll: una puntata
                                # più grande si RIDUCE allo spazio che resta (veto solo sotto i 2 €). Sotto i 100 €,
                                # senza niente di aperto, il tetto non scende sotto la puntata minima: una da 2 €
                                # alla volta resta possibile fino al kill switch
max_open_bets: 4
max_bets_per_day: 10
max_exchange_trades_per_day: 40
max_exposure_per_match_pct: 0.04
max_same_league_open: 3

# ── Qualità dei dati ──────────────────────────────────────────
min_bookmakers: 2               # bookmaker di riferimento per la probabilità giusta
max_odds_age_seconds: 180
min_edge: 0.01                  # EV netto di commissione ≥ 1%
max_plausible_edge: 0.08        # EV > 8% contro un riferimento sharp = quasi sempre un errore di dato: veto
max_reference_age_seconds: 9000 # quote di riferimento pre-partita al massimo di 2,5 ore (piano gratuito: ogni 2 ore)
max_reference_age_live_seconds: 300   # in-play il riferimento deve avere meno di 5 minuti
max_odds_dispersion: 0.06
# Probabilità da tabella storica (S08, nessun bookmaker da confrontare): al posto dei controlli di consenso
max_table_odds: 1.10           # quota massima
max_table_edge: 0.05           # EV massimo: oltre, la tabella non descrive quella partita

# ── Circuit breaker ───────────────────────────────────────────
# Con 2 € minimi su 30 € le percentuali scatterebbero dopo una o due perdite: sotto i 100 € valgono
# limiti ASSOLUTI (budget di perdita), sopra si passa alle percentuali.
small_bankroll: 100             # sotto questa soglia: limiti assoluti e trade alla puntata minima
kill_below_bankroll: 20.0       # KILL SWITCH se il bankroll scende sotto 20 € (−10 € dal capitale)…
max_drawdown_small: 0.334       # …o sotto picco × (1 − 0,334): la soglia sale col picco (a 30 € resta 20 €,
                                # a 60 € diventa 39,96 €), così un profitto non si restituisce tutto senza stop
# Con i SOLDI VERI (mode live) valgono questi due: ci si ferma a 30 € (con 60 € versati si perde al massimo metà;
# scelta dell'utente il 05/10/2026). La soglia sale col picco: a 60 € resta 30 €, a 80 € diventa 40 €.
live_kill_below_bankroll: 30.0
live_max_drawdown_small: 0.5
max_daily_loss_eur: 6.0         # stop fino a domani dopo 6 € persi nel giorno (scelta dell'utente il 02/10/2026; prima 4)
max_daily_loss: 0.09            # sopra i 100 €: −9% nel giorno → stop fino a domani (scelta dell'utente il 05/10/2026; prima 5%)
max_drawdown: 0.15              # sopra i 100 €: −15% dal massimo → KILL SWITCH (reset solo dal PC)
max_losing_streak: 6
cooldown_minutes: 120

# ── 4fun (S10, ex "divertimento"): poche puntate scelte, puntata fissa ──
fun_stake_eur: 4.0            # puntata fissa dei back e rischio massimo dei lay (scelta dell'utente il 05/10/2026: meno puntate,
                               # più alte; prima 2 € = il minimo di betfair.it)
fun_max_bets_per_day: 10       # al massimo 10 puntate al giorno (scelta dell'utente il 02/10/2026; prima 3, poi 5)
fun_open_risk_pct: 0.10        # per il 4fun il rischio aperto arriva al 10% del bankroll (21 € con 210 €: 3 puntate da 4 € ci stanno)
fun_max_open: 3                # fino a 3 puntate aperte insieme (scelta dell'utente il 04/10/2026; prima 1)
fun_min_edge: -0.02            # mai un prezzo che perde più del 3% atteso (commissione compresa: a quota 1,80 vale già 2%)
fun_max_spread: 0.03           # senza riferimento esterno: back e lay di Betfair entro il 3%

# ── Sentiment (Giorgia): può solo frenare ─────────────────────
sentiment_caution_stake_factor: 0.5
