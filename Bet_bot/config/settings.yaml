# ─────────────────────────────────────────────────────────────
#  BET_BOT — impostazioni generali
#  Bot autonomo su Betfair Exchange Italia. Gira in locale sul tuo PC.
#
#  NON modificare questo file: aggiorna.bat lo sostituisce con la versione di GitHub.
#  Le TUE scelte (mode, feed, strategie, dashboard_lan…) vanno in runtime/impostazioni.yaml:
#  hanno la precedenza su questo file e gli aggiornamenti non le toccano. Esempio:
#      mode: paper
#      feed: {provider: betfair, reference: odds_api, record: true}
# ─────────────────────────────────────────────────────────────

# paper = exchange simulato con le stesse regole di Betfair (fill-or-kill, liquidità, commissione),
#         prezzi veri se feed.provider = betfair, soldi finti.
# live  = soldi VERI su Betfair, solo se TUTTI i cancelli sono aperti: execution.provider = betfair,
#         conto verificato, ordine di prova riuscito, interruttore "Puntate reali" acceso nelle
#         Impostazioni e strategia elencata in live_strategies. Altrimenti resta in paper e lo scrive.
mode: paper

capital:
  initial: 30             # budget di partenza in EUR
  currency: EUR

execution:
  provider: paper         # paper | betfair
  min_stake: 2.0          # betfair.it: back da 2 € in su, a multipli di 0,50 €; lay da 0,50 €
  commission: 0.045       # betfair.it: 4,5% sulla vincita netta di mercato (con feed betfair si legge dal mercato)
  paper_liquidity_factor: 1.5   # in paper si abbina solo se nel book c'è 1,5 × la puntata
  lay_apertura: false     # lay d'apertura (S09): false = solo in ombra. Accendilo solo se S09 supera l'esame per il live
                          # (python betbot.py esame). Per i soldi veri serve anche S09 in live_strategies.
live_strategies: []       # es. [S05_favoriti_exchange_v2] — vuota = nessuna strategia con soldi veri

# Strategie che lavorano (le altre nella libreria sono ritirate e non girano).
# Ritirate il 30/09/2026: S04 cavalli (su betfair.it non ci sono), S07 scalping (negativo e mercato .it troppo
# sottile), S08 basket nel quarto quarto (quote 1,01-1,04 e servono dati live).
# Una strategia "attiva" punta solo se il bankroll basta per la puntata minima entro i limiti di
# rischio; altrimenti lavora IN ATTESA (in ombra) e si sblocca da sola quando il bankroll cresce.
active_strategies:
  - S05_favoriti_exchange_v2   # favoriti netti pre-partita (calcio, tennis, basket), EV netto ≥ 2%, parametri per sport
  - S10_divertimento_v2        # prima i lay di valore (S09, rischio 1-2 €), altrimenti back da 2 €; max 10 al giorno
observe_strategies:            # solo ombra, senza capitale: si attivano solo dopo prove sui dati veri di betfair.it
  - S06_live_exchange_v1       # in-play: serve un riferimento live aggiornato (piano a pagamento di The Odds API)
  - S05_favoriti_exchange_v3   # come S05 v2 + filtri sul movimento dei prezzi (6%) e libro ≥ 6 €: in ombra accanto alla v2
  - S10_divertimento_v1        # la v1 (solo back) resta in ombra per il confronto con la v2
  - S10_misura_v1              # la logica della v2 in ombra su TUTTE le partite adatte: campione per l'esame in settimane
  - S09_lay_valore_v1           # lay di valore sul calcio: contro gli esiti che Betfair prezza sotto Pinnacle (~80% vinte a quota 3-8)

feed:
  # mock    = mondo simulato (exchange + bookmaker di riferimento), nessuna chiave. Per provare.
  # betfair = Betfair Exchange Italia: cavalli e calcio con book back/lay. Con la app key "delayed"
  #           (gratuita) i prezzi arrivano in ritardo: va bene per il paper, non per il live.
  provider: mock
  # quote di riferimento per stimare la probabilità giusta nel calcio: none | odds_api
  reference: none
  # statistiche live (minuto, punteggio, tiri, cartellini): none | api_football
  live_stats: none
  # true = salva ogni ciclo i prezzi in runtime/recordings/ (circa 3-5 MB al giorno compressi) per il replay.
  # Acceso: è la prova su betfair.it dei prezzi veri (lay compresi). Con il feed simulato non registra nulla.
  record: true
  sports:                 # chiavi di The Odds API (quote di riferimento) e sport del mondo simulato
    - soccer_italy_serie_a
    - soccer_epl
    - soccer_spain_la_liga
    - tennis_atp
    - tennis_wta
    - basketball_nba
    - americanfootball_nfl   # NFL: giovedì, domenica (dalle 19:00 italiane) e lunedì notte, da settembre a febbraio
  # fuori stagione uno sport non costa crediti (si legge l'elenco gratuito degli sport attivi)
  # gruppi di The Odds API da aggiungere da soli, es. [Tennis]: i tornei cambiano ogni settimana e ognuno costa
  # richieste. Col piano gratuito (500 al mese) lascia vuoto e metti in sports solo 2-3 campionati.
  reference_groups: []
  regions: eu
  markets: h2h
  mock:
    matches_per_cycle: 6
    match_minutes: 90
    speed: 30             # 1 minuto reale = 30 minuti simulati
    bookmakers: 8
    margin: 0.05
    exchange_update: 0.35 # quanto spesso l'exchange simulato insegue la probabilità vera
    exchange_liquidity: 400
    seed: null
  betfair:
    stream: false         # true = prezzi in tempo reale dallo Stream API invece del polling
    race_countries: [GB, IE]
    race_hours: 2
    sports: [soccer, tennis, basketball, americanfootball, baseball, icehockey, volleyball, darts, snooker, tabletennis, rugbyunion, rugbyleague, handball]   # mercati MATCH_ODDS letti (e registrati) da Betfair
    auto_sports: true                      # scopre da solo ogni 6 ore gli sport del conto (futsal, floorball…): solo lettura e misura in ombra, mai soldi veri
    soccer_hours: 36                       # finestra per gli eventi (tutti gli sport qui sopra)
  odds_api:
    max_credits_per_day: 15        # 15 × 30 giorni ≈ 450: dentro i 500 del piano gratuito
    min_remaining: 50              # sotto 50 crediti rimasti il riferimento si ferma (e S05 con lui)
    odds_refresh_seconds: 43200    # solo NBA/NFL (se in stagione), ogni 12 ore. Il calcio NON si scarica a tappeto: solo
                                   # su richiesta, un campionato alla volta, quando c'è un lay possibile (feeds/__init__.py)
    scores_refresh_seconds: 0      # spento: con Betfair i risultati li dà Betfair (prima costavano 2 crediti per sport)
    soccer_on_demand: true         # true = calcio solo su richiesta (lay possibile); false = a tappeto ogni odds_refresh_seconds
    on_demand_min_gap_seconds: 2400    # stesso campionato al massimo ogni 40 minuti…
    on_demand_max_per_league_day: 4    # …e 4 volte al giorno
  api_football:
    live_refresh_seconds: 120
    stats_from_minute: 55
    max_stats_per_refresh: 4

cycle_seconds: 60
dashboard_port: 8766
dashboard_lan: false     # true = la dashboard si vede anche dal telefono sulla rete di casa (solo lettura:
                         # impostazioni e azioni restano sul PC). Poi apri http://<IP del PC>:8766 dal telefono.

autotest:                  # test che partono da soli con avvia.bat, in sottofondo (betbot/autotest.py)
  enabled: true
  orizzonti_ore: 24        # quando conviene entrare, dalle registrazioni (gratis)
  allenamento_giorni: 7    # le strategie rigiocano 5 anni di storico (gratis)
  test_rapido_giorni: 7    # 6 ore contro Pinnacle: ~150 crediti di The Odds API, quindi una volta a settimana
  test_rapido_min_crediti: 250
  multiple_ore: 24         # multiple virtuali dalle puntate in ombra (gratis)
  backtest_giorni: 7       # strategie sullo storico dei prezzi Betfair (gratis)
  nfl_giorni: 30           # backtest football americano (gratis)

coach:                     # Leo, l'allenatore: autopsia di ogni puntata e regole imparate dagli errori
  min_n: 30                # puntate minime in un segmento prima di trarre una lezione
  apply_rules: true        # le regole possono SOLO bloccare (mai allargare i limiti); false = solo osservazione
  max_rules: 12
