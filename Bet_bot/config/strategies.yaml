# Parametri delle strategie. Ogni strategia è un file versionato in betbot/strategies/:
# per cambiarla si crea una versione nuova, mai si sovrascrive. Quelle non elencate in
# settings.yaml (active_strategies / observe_strategies) sono ritirate e non girano.
# commission e min_stake arrivano da settings.yaml → execution.

S05_favoriti_exchange_v2:
  description: Favoriti netti pre-partita (calcio, tennis ATP/WTA, basket) su Betfair quando la quota, al netto della commissione, batte di almeno
    il 2% la probabilità giusta dei bookmaker di riferimento.
  min_edge: 0.02
  min_reference_books: 2
  min_book_eur: 3.0
  max_spread_ticks: 2
  max_minutes_before: 120
  min_minutes_before: 15
  sports:
    soccer:
      odds_min: 1.1
      odds_max: 1.4
      min_fair_prob: 0.75
    tennis:
      odds_min: 1.1
      odds_max: 1.35
      min_fair_prob: 0.75
      exclude: challenger|itf|utr|m15|m25|w15|w35|w50|w75|w100|doppio|doubles
    basketball:
      odds_min: 1.1
      odds_max: 1.3
      min_fair_prob: 0.77
S05_favoriti_exchange_v3:
  description: Come S05 v2, ma salta se la probabilità di riferimento o il prezzo Betfair si sono mossi più del 6% dalla
    prima lettura (notizie o riferimento rimasto indietro) e chiede almeno 6 € al miglior prezzo. In ombra accanto alla v2.
  min_edge: 0.02
  min_reference_books: 2
  min_book_eur: 6.0
  max_spread_ticks: 2
  max_minutes_before: 120
  min_minutes_before: 15
  max_ref_drift: 0.06
  max_bf_drift: 0.06
  sports:
    soccer:
      odds_min: 1.1
      odds_max: 1.4
      min_fair_prob: 0.75
    tennis:
      odds_min: 1.1
      odds_max: 1.35
      min_fair_prob: 0.75
      exclude: challenger|itf|utr|m15|m25|w15|w35|w50|w75|w100|doppio|doubles
    basketball:
      odds_min: 1.1
      odds_max: 1.3
      min_fair_prob: 0.77
S10_divertimento_v1:
  description: 'Per giocare: 2 € fissi, al massimo 3 al giorno e una aperta alla volta, su qualunque sport, al prezzo
    più vicino al giusto (Pinnacle o prezzo medio Betfair). In media perde la commissione e mezzo spread (1-3%).'
  odds_min: 1.4
  odds_max: 3.0
  max_spread: 0.03
  min_book_eur: 10.0
  min_minutes_before: 10
  max_minutes_before: 240
  min_ev: -0.03
S06_live_exchange_v1:
  description: Favorito in vantaggio nel finale, su Betfair in-play; chiusura con un lay se il vantaggio sparisce.
  min_minute: 70
  min_lead: 1
  odds_min: 1.05
  odds_max: 1.3
  min_edge: 0.01
  skip_if_red_card: true
  min_opp_shots_check: 5
  max_opp_shot_ratio: 2.0
  close_on_lead_lost: true
S07_scalping_prepartita_v1:
  description: Trade back→lay prima dell'inizio (calcio, tennis, basket) sul lato con più denaro in attesa; uscita al target, allo stop o 3 minuti
    prima dell'inizio.
  odds_min: 1.5
  odds_max: 4.0
  max_minutes_before: 120
  min_minutes_before: 10
  exit_minutes_before: 5
  target_ticks: 2
  stop_ticks: 3
  slippage_ticks: 6
  wom_min: 0.65
  min_book_multiple: 5.0
  min_net_target_return: 0.004
  sports:
  - soccer
  - tennis
  - basketball
S08_basket_quarto_quarto_v1:
  description: 'Basket in-play: back di chi conduce di 15+ punti all''inizio del quarto quarto, solo se Betfair paga più della probabilità storica
    (96,5-99,5%).'
  min_lead: 15
  min_elapsed: 0.75
  max_elapsed: 0.85
  min_edge: 0.005
  odds_max: 1.1
S04_greenup_cavalli_v2:
  description: 'Cavalli pre-gara su Betfair: back→lay con target e stop in tick, uscita 60 s prima del via, puntata dimensionata sulla perdita
    massima.'
  odds_min: 2.0
  odds_max: 6.0
  min_seconds_to_off: 180
  max_seconds_to_off: 900
  exit_seconds_to_off: 60
  target_ticks: 2
  stop_ticks: 3
  slippage_ticks: 6
  wom_min: 0.62
  min_book_multiple: 5.0
  min_net_target_return: 0.004
S05_favoriti_exchange_v1:
  description: Favoriti netti pre-partita (calcio, tennis, basket) su Betfair quando la quota, al netto della commissione, batte la probabilità
    giusta dei bookmaker di riferimento.
  odds_min: 1.1
  odds_max: 1.4
  min_fair_prob: 0.75
  min_edge: 0.01
  hours_before_kickoff: 36
  min_hours_before_kickoff: 0.25
  min_reference_books: 2
S01_favoriti_v1:
  description: Favoriti netti pre-partita con quota migliore superiore alla probabilità di consenso.
  odds_min: 1.15
  odds_max: 1.3
  min_fair_prob: 0.78
  min_edge: 0.015
  hours_before_kickoff: 36
  min_hours_before_kickoff: 0.25
S02_live_scalp_v1:
  description: Favorito in vantaggio nel finale; puntata micro con cash-out se il vantaggio sparisce.
  min_minute: 70
  min_lead: 1
  odds_min: 1.05
  odds_max: 1.22
  min_edge: 0.01
  cashout_on_lead_lost: true
  skip_if_red_card: true
  min_opp_shots_check: 5
  max_opp_shot_ratio: 2.0
S03_surebet_v1:
  description: Arbitraggio tra bookmaker (somma delle probabilità implicite < 1).
  min_margin: 0.004
  max_margin: 0.03
  max_odds: 6.0
S04_greenup_cavalli_v1:
  description: Cavalli pre-gara su exchange, back-to-lay con green-up prima del via (dal bot Betfair di riferimento).
  odds_min: 2.0
  odds_max: 6.0
  min_seconds_to_off: 180
  max_seconds_to_off: 900
  exit_seconds_to_off: 60
  target_ticks: 2
  stop_ticks: 3
  wom_min: 0.62
  commission: 0.05
