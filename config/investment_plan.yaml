# ─────────────────────────────────────────────────────────────
#  IL TUO PIANO — profilo EQUILIBRATO su UNA SOLA PIATTAFORMA
#  Deciso il 29/09/2026. Solo ciò che l'ufficio può gestire da solo
#  via API: nessun'altra app (niente Satispay, niente banca da gestire).
#  Le stime NON sono promesse: servono a capire l'ordine di grandezza.
# ─────────────────────────────────────────────────────────────
profile: Equilibrato
platform: Bybit (spot, senza leva)
currency: EUR
start_capital: 200
monthly: 50

# Come lavorano i soldi dentro Bybit. Le quote sono il MASSIMO investito:
# quando le strategie non hanno segnali, il capitale resta in USDC.
sleeves:
  - name: Accumulo automatico BTC
    status: paper                 # scelta C del 29/09/2026 · primo acquisto paper dal 5 ottobre 2026
    max_share: 1.00
    note: "50 € al mese in BTC dal giorno 5, strada più economica (diretta o via USDC). Nessuna promessa di vantaggio: è una scelta di lungo periodo su BTC. Mai vendite automatiche"
  - name: Motore trend (STRATEGY_01_v5)
    status: bocciata              # 29/09/2026: riverificata con le commissioni reali di Bybit EU (0,25%)
    max_share: 0.0
    note: "Con le commissioni reali resta in utile (PF 2,27) ma lo Sharpe scende a 0,96, sotto la soglia 1,0 fissata prima dei test. Le soglie non si abbassano dopo aver visto i risultati"
  - name: BTC sopra la media di lungo periodo (STRATEGY_06_v1)
    status: in osservazione       # 29/09/2026: 10 criteri su 11, ora seguita in ombra per 12 mesi
    max_share: 0.0
    note: "Fuori campione 2021-2025: +26%/anno contro +19% di compra e tieni, perdita massima 31% contro 77%. Ma su 3,6 anni la probabilità che non sia fortuna è 77%, sotto il 90% richiesto (Deflated Sharpe). Hold-out non consumato"
  - name: Tesoriere · USDC in Earn flessibile
    status: rinviato              # verificato il 29/09/2026 sull'app Bybit EU
    max_share: 0.0
    note: "Earn USDC flessibile all'1,02%: su 200 € sono circa 2 €/anno, e in Earn gli USDC passano di proprietà a Bybit EU (fuori dalle tutele MiCAR). Si riconsidera oltre ~2.000 € investiti o con rendimento flessibile ≥ 3%"
  - name: Rotazione settimanale (STRATEGY_04_v1)
    status: in osservazione       # solo in ombra, nessun capitale
    max_share: 0.0
    note: entra solo se supera la revisione dopo 12 mesi in ombra

# Cosa fai tu (non si può automatizzare) e cosa fa l'ufficio
you_do:
  - Aprire il conto Bybit EU e fare il riconoscimento (KYC)
  - Creare le chiavi API solo trading (niente prelievi, IP del tuo PC)
  - Impostare in banca un bonifico periodico di 50 € verso Bybit (una volta sola)
  - Dichiarazione dei redditi (l'Auditor ti prepara il riepilogo annuale)
office_does:
  - Ogni mese compra BTC con 50 €, scegliendo la strada più economica (diretta o via USDC)
  - Rimanda l'acquisto (mai lo salta) con dati anomali, spread alto o allarmi di Nora
  - Segue in ombra, senza soldi, le strategie promettenti per raccogliere prove
  - Usa strategie di trading solo se superano la verifica con i costi reali

# Tempi (onesti): il capitale reale arriva solo dopo i criteri di promozione
phases:
  - when: 29/09/2026
    what: "Verificate con i costi reali: v5 e BTC di lungo periodo non superano tutti i criteri. Nessuna strategia approvata"
  - when: 5 ottobre e 5 novembre 2026
    what: "Primi due acquisti di accumulo in paper (deposito simulato, prezzi veri). I 50 € restano sul tuo conto"
  - when: dicembre 2026
    what: "Se i due acquisti sono andati bene: attivazione dei soldi veri per l'accumulo (chiavi API solo trading, bonifico periodico). Decisione tua"
  - when: ottobre 2027
    what: "Revisione della strategia BTC di lungo periodo dopo 12 mesi in ombra: se supera, potrà decidere quando stare fuori da BTC"

risks:
  - "Accumulo in BTC: nei crolli (in passato fino a -77%) il valore scende e il piano continua a comprare; non esce da solo"
  - "Tutto su crypto: nessuna diversificazione fuori da questo mondo"
  - "Rischio piattaforma: se Bybit ha problemi, i soldi sono lì (il kill switch non protegge da questo)"
  - "USDC è una stablecoin: rischio basso ma non zero di perdere la parità col dollaro"
  - "Cambio EUR/USD: il conto è in dollari digitali"
  - "Tasse: plusvalenze crypto al 33% dal 2026, da dichiarare"
  - "Commissioni Bybit EU 0,25% per ordine a mercato: le strategie con molti scambi faticano a coprirle"

# Proiezione a 10 anni con 200 € + 50 €/mese (6.200 € versati). Lordo tasse.
projection:
  years: 10
  scenarios:
    - { label: "Negativo (-3%/anno)", rate: -0.03 }
    - { label: "Prudente (+3%/anno)", rate: 0.03 }
    - { label: "Centrale (+7%/anno)", rate: 0.07 }
    - { label: "Favorevole (+10%/anno)", rate: 0.10 }
