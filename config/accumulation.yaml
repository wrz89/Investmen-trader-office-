# ─────────────────────────────────────────────────────────────
#  PIANO DI ACCUMULO AUTOMATICO (scelta C dell'utente, 29/09/2026;
#  70 €/mese e diversificazione BTC/ETH/SOL decise il 29/09/2026)
#  Non è una strategia di trading e non promette un vantaggio: è una
#  scelta d'investimento dell'utente sulle crypto nel lungo periodo.
#  L'ufficio la esegue con disciplina: stesso importo, stesso giorno,
#  senza mai comprare di più dopo un calo e senza mai vendere da solo.
# ─────────────────────────────────────────────────────────────
enabled: true
# Quote obiettivo del portafoglio accumulato. Coppie in euro: una sola commissione
# (la strada via USDC si usa solo se costa meno, commissioni comprese).
# 29/09/2026, scelta dell'utente: 70% NUCLEO (BTC, ETH) + 30% PARTE PIÙ RISCHIOSA
# (SOL, XRP: più volatili, già seguite da Sofia e Nora). Sempre a pronti, niente leva.
allocation:
  BTC/EUR: 0.49          # nucleo 70% → BTC 70%
  ETH/EUR: 0.21          # nucleo 70% → ETH 30%
  SOL/EUR: 0.15          # rischio 30% → SOL 50%
  XRP/EUR: 0.15          # rischio 30% → XRP 50%
groups:
  nucleo: [BTC/EUR, ETH/EUR]
  rischio: [SOL/EUR, XRP/EUR]
# Ribilanciamento SOLO con i nuovi acquisti: ogni mese l'importo va prima agli asset
# sotto la loro quota. Mai vendite (niente commissioni e niente tasse in più).
min_leg_eur: 5           # sotto questa cifra la quota del mese passa all'asset più sotto peso
amount_eur: 70           # importo FISSO: non aumenta mai dopo un calo (regole 3 e 4)

# Esecuzione (approvata dall'utente il 29/09/2026): ordine LIMITE al miglior prezzo
# di acquisto (commissione maker 0,10% invece di 0,25%). Se entro 24 ore non viene
# eseguito, si annulla e si compra a mercato: l'acquisto del mese non salta mai.
# In paper l'ordine limite conta come eseguito solo se il prezzo scende SOTTO il
# limite (prudente: chi era prima in coda viene servito prima).
execution:
  order_type: limit
  limit_timeout_hours: 24
# Spread massimo accettato per l'accumulo (le coppie in euro sono meno liquide di quelle
# in USDC; con l'ordine limite si compra al prezzo di acquisto e lo spread non si paga).
# Oltre questa soglia l'acquisto si RIMANDA, non si salta.
max_spread_bps: 50

# SOLDI VERI (decisione dell'utente del 29/09/2026): l'ufficio esegue con una chiave API
# di Bybit EU solo trading, senza prelievi, legata all'IP del PC. Si attiva dalle
# Impostazioni, solo dopo: chiave verificata + ordine di prova da 5 € riuscito.
# Il modulo può SOLO comprare le monete qui sopra; tetto mensile = importo pianificato.
day_of_month: 5          # dal 5 del mese (dopo lo stipendio e il bonifico periodico)
# Capitale iniziale (deciso dall'utente il 29/09/2026): 140 € entrati a rate, non in un
# giorno solo. Calendario fissato prima di iniziare: 35 € in più nei primi 4 acquisti
# (105 € al mese per 4 mesi, poi 70 €). Non dipende dall'andamento del prezzo.
initial_eur: 140
initial_tranches: 4
start_month: "2026-10"

# Si RIMANDA (mai si salta) al ciclo successivo se Franco vede: dati vecchi o
# anomali, spread oltre il limite, API instabile, allarme notizie di Nora su
# quell'asset o su tutto (es. Bybit). Si rimanda solo la parte di quell'asset:
# l'acquisto del mese resta dovuto.

# Vendite: mai automatiche. Solo per tua decisione o, in futuro, se la
# STRATEGY_06 (BTC sopra la media di lungo periodo) supererà la revisione
# dopo l'osservazione in ombra: allora potrà decidere quando stare fuori.
sells: never

# Passaggio ai soldi veri. Il 29/09/2026 l'utente ha deciso di partire subito, senza i
# 2 mesi di prova in paper previsti prima: al loro posto, controlli tecnici sul reale.
go_live:
  min_paper_buys: 0      # era 2: rinunciato per decisione esplicita dell'utente (29/09/2026)
  max_errors: 0
  requires:
    - "conto Bybit EU verificato e fondi depositati (fatto il 29/09/2026)"
    - "chiave API verificata dall'ufficio: solo trading spot, prelievi disattivati, legata all'IP del PC"
    - "ordine di prova da 5 € in BTC riuscito e registrato"
    - "interruttore 'Acquisti reali' acceso da te nelle Impostazioni"

# Promemoria per te (Marco li manda su Telegram, una volta sola, dalla data indicata).
reminders:
  - date: "2027-02-01"
    text: "Da febbraio l'ufficio passa da solo da 105 € a 70 € al mese: le 4 rate del capitale iniziale sono finite. Controlla solo che il bonifico periodico di 70 € verso Bybit resti attivo."
